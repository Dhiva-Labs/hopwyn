name: hopwyn
base: core24
adopt-info: hopwyn
summary: One mouse and keyboard for every computer in your home
description: |
  Move the cursor off the edge of one screen and it appears on the next.
  The computer you left goes inactive; the one you entered becomes active.

  - Pair by clicking Add computer on one and Pair on both; nothing to type.
  - Up to 4 computers, one on each side of the screen; drag to arrange.
  - Private: no account, no cloud. Everything stays on your home network,
    encrypted with TLS 1.3 and pinned device keys.

  Developer preview for Linux (GNOME 45+ or KDE Plasma 6.1+ on Wayland,
  which provide the InputCapture portal). Ctrl+Alt+Esc always gives your
  cursor back.
grade: devel
confinement: strict
license: Apache-2.0
website: https://github.com/Dhiva-Labs/hopwyn
source-code: https://github.com/Dhiva-Labs/hopwyn
issues: https://github.com/Dhiva-Labs/hopwyn/issues

apps:
  hopwyn:
    command: bin/hopwyn-app
    desktop: share/applications/app.hopwyn.Hopwyn.desktop
    common-id: app.hopwyn.Hopwyn
    extensions: [gnome]
    plugs:
      - network
      - network-bind
      - desktop
      - wayland
      - x11

parts:
  hopwyn:
    # Built by hand rather than with the rust plugin: core24's Rust is too
    # old (1.75) and the plugin's rustup check runs before build-snaps.
    plugin: nil
    source: .
    build-snaps:
      - rustup
    build-packages:
      - pkg-config
      - libgtk-4-dev
      - libadwaita-1-dev
    override-pull: |
      craftctl default
      craftctl set version="0.1.0+git$(git rev-parse --short HEAD 2>/dev/null || echo unknown)"
    override-build: |
      export PATH="/snap/bin:$HOME/.cargo/bin:$PATH"
      # The GNOME extension points LD_LIBRARY_PATH at the SDK's libc, which
      # breaks rustup, cargo and build scripts; libraries are found through
      # pkg-config instead.
      env -u LD_LIBRARY_PATH rustup toolchain install 1.93 --profile minimal
      env -u LD_LIBRARY_PATH cargo +1.93 build --release --locked -p hopwyn-app
      install -Dm755 target/release/hopwyn-app "$CRAFT_PART_INSTALL/bin/hopwyn-app"
      install -Dm644 crates/hopwyn-app/data/app.hopwyn.Hopwyn.desktop \
        "$CRAFT_PART_INSTALL/share/applications/app.hopwyn.Hopwyn.desktop"
      sed -i 's|^Icon=.*|Icon=${SNAP}/share/icons/hicolor/scalable/apps/app.hopwyn.Hopwyn.svg|' \
        "$CRAFT_PART_INSTALL/share/applications/app.hopwyn.Hopwyn.desktop"
      install -Dm644 crates/hopwyn-app/data/icons/hicolor/scalable/apps/app.hopwyn.Hopwyn.svg \
        "$CRAFT_PART_INSTALL/share/icons/hicolor/scalable/apps/app.hopwyn.Hopwyn.svg"
