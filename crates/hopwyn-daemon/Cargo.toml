[package]
name = "hopwyn-daemon"
description = "The Hopwyn background service: ties capture, transport and injection together"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "hopwyn"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
hopwyn-core = { path = "../hopwyn-core" }
hopwyn-discovery = { path = "../hopwyn-discovery" }
hopwyn-input = { path = "../hopwyn-input" }
hopwyn-pair = { path = "../hopwyn-pair" }
hopwyn-proto = { path = "../hopwyn-proto" }
hopwyn-transport = { path = "../hopwyn-transport" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
