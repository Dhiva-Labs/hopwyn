[package]
name = "hopwyn-mobile"
description = "Hopwyn for phones: the shared core of the Android app (pairing, link, trackpad and keyboard input)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
# cdylib: libhopwyn_mobile.so for the Android app; rlib: tests and tools.
crate-type = ["cdylib", "rlib"]

# Not the workspace lints: the JNI entry points need #[unsafe(no_mangle)],
# which the workspace forbids. Unsafe stays denied everywhere else.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

[dependencies]
hopwyn-discovery = { path = "../hopwyn-discovery" }
hopwyn-pair = { path = "../hopwyn-pair" }
hopwyn-proto = { path = "../hopwyn-proto" }
hopwyn-transport = { path = "../hopwyn-transport" }
jni = "0.21"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
