[workspace]
resolver = "3"
members = [
    "crates/hopwyn-app",
    "crates/hopwyn-core",
    "crates/hopwyn-daemon",
    "crates/hopwyn-discovery",
    "crates/hopwyn-input",
    "crates/hopwyn-mobile",
    "crates/hopwyn-pair",
    "crates/hopwyn-proto",
    "crates/hopwyn-transport",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
